<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log File Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }

        .log-container {
            background-color: #212529;
            color: #e9ecef;
            font-family: monospace;
            padding: 15px;
            border-radius: 5px;
            height: 70vh;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .directory-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .file-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .spinner-border {
            display: none;
        }

        .active-directory {
            background-color: #e9ecef;
            font-weight: bold;
        }

        .active-file {
            background-color: #e9ecef;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Log File Viewer</h1>

        <div class="row">
            <div class="col-md-3">
                <div class="card mb-3">
                    <div class="card-header bg-primary text-white">
                        <i class="bi bi-folder"></i> Log Directories
                    </div>
                    <div class="card-body directory-list" id="directoryList">
                        <div class="text-center">
                            <div class="spinner-border spinner-border-sm" role="status" id="dirSpinner">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header bg-success text-white">
                        <i class="bi bi-file-earmark-text"></i> Log Files
                    </div>
                    <div class="card-body file-list" id="fileList">
                        <p class="text-muted">Select a directory to view files</p>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div class="card">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-file-earmark-text"></i> Log Content</span>
                        <div>
                            <div class="input-group input-group-sm" style="width: 150px;">
                                <span class="input-group-text">Lines</span>
                                <input type="number" class="form-control" id="linesCount" value="100" min="10" max="10000">
                                <button class="btn btn-outline-light" id="refreshLog">
                                    <i class="bi bi-arrow-clockwise"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <span id="currentFile" class="text-muted">No file selected</span>
                        </div>
                        <div class="log-container" id="logContent">
                            Select a log file to view its content
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
